# Configuración de Terraria LXC Manager
# Ruta instalada: /etc/terraria-lxc/terraria-lxc.conf
# Tras cambiar algo no hace falta reiniciar nada: se lee en cada operación.

# Versión del servidor dedicado (número sin puntos, tal y como aparece en
# https://terraria.org/api/download/pc-dedicated-server/terraria-server-XXXX.zip).
# Debe coincidir con la versión del juego de los jugadores.
TERRARIA_VERSION="1461"

# Imagen base de los contenedores.
IMAGE="ubuntu:24.04"

# Rango de puertos públicos que se reparten entre los servidores.
PORT_MIN="7777"
PORT_MAX="7876"

# Número máximo de servidores que se pueden crear desde la web.
MAX_SERVERS="10"

# Límites de recursos de cada contenedor.
MEMORY_LIMIT="2GiB"
CPU_LIMIT="2"

# Dirección que se muestra a los jugadores (IP o dominio).
# Vacío = la dirección con la que se ha abierto el panel.
PUBLIC_HOST=""
